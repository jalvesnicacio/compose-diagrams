[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "descriptors-diagrams"
version = "0.2.0"
description = "Create system architectural diagrams from docker-compose files."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Jalves Nicacio" }]
dependencies = [
    "diagrams>=0.24",
    "PyYAML>=6",
]

[project.urls]
Repository = "https://github.com/jalvesnicacio/descriptors-diagrams"

[project.scripts]
descriptors-diagrams = "descriptors_diagrams.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
